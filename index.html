<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자정의 시험기간 | Midnight Exam</title>
    <meta name="description" content="시험기간, 당신이 마주하게 될 가장 끔찍한 딴짓. 인터랙티브 공포 시뮬레이터.">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Noise Overlay -->
        <div class="noise-overlay"></div>
        <div class="vignette"></div>

        <!-- Start Screen -->
        <section id="start-screen" class="screen active">
            <h1 class="main-title glitch" data-text="자정의 시험기간">자정의 시험기간</h1>
            <p class="subtitle">시험공부보다 더 무시무시한 일이 당신을 기다립니다.</p>
            <button id="start-btn" class="horror-btn">체험 시작하기</button>
        </section>

        <!-- Scenario Selection Screen -->
        <section id="select-screen" class="screen">
            <h2 class="section-title">공포의 주제를 선택하십시오</h2>
            <div class="select-container">
                <div class="select-card">
                    <div class="card-image">
                        <img src="assets/knock_select.png" alt="Knock scenario">
                    </div>
                    <button id="select-knock" class="select-btn" data-desc="새벽 2시, 현관문 너머에서 들려오는 의문의 노크 소리.">
                        <span class="btn-main">현관문 노크</span>
                    </button>
                </div>
                <div class="select-card">
                    <div class="card-image">
                        <img src="assets/library_select.png" alt="Library scenario">
                    </div>
                    <button id="select-lib" class="select-btn" data-desc="아무도 없는 도서관 열람실, 복도 끝에서 들리는 울음소리.">
                        <span class="btn-main">밤의 도서관</span>
                    </button>
                </div>
                <div class="select-card">
                    <div class="card-image">
                        <img src="assets/sleep_select.png" alt="Sleep scenario">
                    </div>
                    <button id="select-sleep" class="select-btn" data-desc="몸이 움직이지 않는 가위눌림, 천장에서 내려오는 검은 형체.">
                        <span class="btn-main">가위눌림</span>
                    </button>
                </div>
            </div>
            <p id="select-description" class="select-desc">운명을 선택하십시오...</p>
        </section>

        <!-- Story Screen -->
        <section id="story-screen" class="screen">
            <div class="scene-container">
                <!-- Navigation UI -->
                <div class="story-nav">
                    <button id="back-btn" class="icon-btn" title="이전으로 돌아가기">
                        <span>⬅</span> 이전 단계로
                    </button>
                </div>

                <div id="image-portal" class="image-portal">
                    <img id="scene-image" src="" alt="horror scene">
                    <div id="warning-overlay" class="warning-overlay" style="display: none;">
                        <div class="warning-content">
                            <p class="warning-text">⚠️ 깜짝주의 ⚠️</p>
                            <button id="reveal-btn" class="reveal-btn">확인하기</button>
                        </div>
                    </div>
                    </div>
                </div>
                <div class="text-window">
                    <div id="scene-text" class="typewriter"></div>
                </div>
                <div id="choice-container" class="choice-container">
                    <!-- Choices will be injected here -->
                </div>
            </div>
            
            <!-- Audio UI -->
            <div class="audio-controls">
                <button id="audio-toggle" class="icon-btn">
                    <span id="audio-icon">🔇</span>
                    <span id="audio-status">사운드 OFF</span>
                </button>
            </div>
        </section>

        <!-- Ending Screen -->
        <section id="ending-screen" class="screen">
            <h2 id="ending-title" class="ending-title"></h2>
            <p id="ending-desc" class="ending-desc"></p>
            <div class="action-buttons">
                <button id="restart-btn" class="horror-btn">다시 시작하기</button>
                <button id="share-btn" class="classic-btn">공포 공유하기</button>
            </div>
        </section>
    </div>

    <!-- Background Music Holder -->
    <audio id="bgm" loop>
        <source src="assets/bgm.mp3" type="audio/mpeg">
    </audio>

    <script src="app.js"></script>
</body>
</html>
